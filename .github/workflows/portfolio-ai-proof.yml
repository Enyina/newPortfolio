name: Check portfolio AI proof and interface
on:
  push:
    branches: [main]
    paths:
      - 'src/portfolio/**'
      - 'tests/**'
      - 'public/index.html'
      - 'public/release.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/portfolio-ai-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exactly the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify published case studies, claims and privacy boundaries
        run: node --test tests/*.test.mjs
      - name: Verify the interactive exhibit
        run: CI=true npm test -- --watch=false --runInBand
      - name: Check the production build
        run: CI=true npm run build
